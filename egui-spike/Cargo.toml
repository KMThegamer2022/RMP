[package]
name = "egui-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate: keeps egui out of the shipping rmp package and its Cargo.lock.
[workspace]

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = { version = "0.6.5", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSColor", "NSColorSpace", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSString"] }
raw-window-handle = "0.6.2"
rfd = "0.18.0"

# The engine itself: src/lib.rs at the repo root, compiled unchanged as this crate's library.
# Making it the library root keeps its `crate::` paths valid.
[lib]
path = "../src/lib.rs"
