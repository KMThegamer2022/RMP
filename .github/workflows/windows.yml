name: Build Windows player
on:
  push:
    branches: [main]
    tags: ['v*-windows']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Rust target
        run: rustup toolchain install nightly-2025-09-01 --profile minimal --component rust-src
      - name: Fetch pinned VideoLAN runtime
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 https://download.videolan.org/pub/videolan/vlc/3.0.24/win64/vlc-3.0.24-win64.7z -o vlc.7z
          if ((Get-FileHash vlc.7z).Hash -ne '1ED59C09152E78AFF84663FA76EFAB26057716576DB74332858810E5EF54AE1F') { throw 'Unexpected VLC digest' }
          7z x -y vlc.7z
      - name: Compile and bundle RMP
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/mingw64/bin:$PATH"
          CC=gcc WINDRES=windres bash windows/build.sh vlc-3.0.24 build/RMP
      - name: Index bundled codecs
        shell: pwsh
        run: |
          ./vlc-3.0.24/vlc-cache-gen.exe (Resolve-Path build/RMP/plugins)
          if (!(Test-Path build/RMP/plugins/plugins.dat)) { throw 'Missing codec index' }
      - name: Exercise packaged playback
        shell: pwsh
        run: |
          python -c "import wave; f=wave.open('fixture.wav','wb'); f.setparams((1,2,44100,0,'NONE','')); f.writeframes(bytes(44100*2*5)); f.close()"
          $p = Start-Process build/RMP/RMP.exe -ArgumentList '--smoke-test', (Resolve-Path fixture.wav) -PassThru
          if (!$p.WaitForExit(40000)) { $p.Kill(); throw 'Playback test timed out' }
          if ($p.ExitCode -ne 0) { throw "Playback test failed ($($p.ExitCode))" }
          7z a -tzip RMP-Windows-x64.zip ./build/RMP
      - name: Switch all themes and verify preference restoration
        shell: pwsh
        run: ./windows/test-themes.ps1 ./build/RMP/RMP.exe (Resolve-Path fixture.wav)
      - name: Exercise manual update command against GitHub
        shell: pwsh
        run: ./windows/test-update.ps1 ./build/RMP/RMP.exe
      - name: Compare launch timings with Windows v1
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 2 https://github.com/KMThegamer2022/RMP/releases/download/v1.0.0-windows/RMP-Windows-x64.zip -o baseline.zip
          7z x -obaseline baseline.zip
          foreach ($app in @('baseline/RMP/RMP.exe','build/RMP/RMP.exe')) {
            foreach ($trial in 1..5) {
              $timer = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process $app -PassThru
              while (!$p.HasExited -and ($p.MainWindowHandle.ToInt64() -eq 0) -and $timer.ElapsedMilliseconds -lt 20000) { Start-Sleep -Milliseconds 10; $p.Refresh() }
              if ($p.MainWindowHandle.ToInt64() -eq 0) { throw 'No player window' }
              Write-Host "WINDOW_MS $app $($timer.ElapsedMilliseconds)"
              $null=$p.CloseMainWindow()
              if (!$p.WaitForExit(5000)) { $p.Kill() }
              $timer.Restart()
              $p = Start-Process $app -ArgumentList '--smoke-test',(Resolve-Path fixture.wav) -PassThru
              if (!$p.WaitForExit(30000) -or $p.ExitCode -ne 0) { throw 'Playback benchmark failed' }
              Write-Host "PLAYBACK_TEST_MS $app $($timer.ElapsedMilliseconds)"
            }
          }
      - name: Build installer and test installed playback
        shell: pwsh
        run: |
          $root = (Resolve-Path build/RMP).Path
          $entries = Get-ChildItem $root -Recurse | Sort-Object { $_.FullName.Length } -Descending | ForEach-Object {
            $verb = if ($_.PSIsContainer) { 'RMDir' } else { 'Delete' }
            '{0} "$INSTDIR\{1}"' -f $verb,$_.FullName.Substring($root.Length+1)
          }
          $entries | Set-Content windows/uninstall-files.nsh
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" windows/setup.nsi
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          $p = Start-Process ./RMP-Setup-x64.exe -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode) { throw 'Install failed' }
          $app = "$env:LOCALAPPDATA/Programs/RMP"
          $p = Start-Process "$app/RMP.exe" -ArgumentList '--smoke-test',(Resolve-Path fixture.wav) -PassThru
          if (!$p.WaitForExit(40000) -or $p.ExitCode -ne 0) { throw 'Installed playback failed' }
          Start-Process "$app/Uninstall.exe" -ArgumentList '/S' -Wait
          $limit = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path "$app/RMP.exe") -and [DateTime]::UtcNow -lt $limit) { Start-Sleep -Milliseconds 200 }
          if (Test-Path "$app/RMP.exe") { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RMP-Windows-x64
          path: |
            RMP-Windows-x64.zip
            RMP-Setup-x64.exe
            RMP-Windows7-preview.png
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RMP-Windows-x64
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" RMP-Windows-x64.zip RMP-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --verify-tag --title "RMP for Windows · $GITHUB_REF_NAME" --notes "Run RMP-Setup-x64.exe or extract the portable ZIP. Targets Windows 7 SP1 x64 and newer. Aero Glass follows the desktop theme. Build, playback and installer tested on Windows Server 2022. Windows 7 desktop verification pending."
